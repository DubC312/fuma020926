name: TheSportsDB Cartoons aktualisieren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cartoons:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Cartoon-Bilder ermitteln
        run: python update_cartoons.py

      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json
          git diff --cached --quiet || git commit -m "Update TheSportsDB player cartoons"
          git push
